; InventoryMonitor 플러그인을 위한 언어 설정 파일
; 새로운 설정/기본은 이 파일을 업그레이드할 때 자동으로 나타나지 않습니다

language.name = 한국어
language.selected = {%0} ({%1})이(가) 기본 언어로 선택되었습니다


; generic command messages
commands.generic.onlyPlayer = 게임 내에서만 사용할 수 있습니다
commands.generic.player.notFound = {%0}는 잘못된 플레이어 이름입니다


; main command messages
commands.inventorymonitor.description = 플레이어의 인벤토리를 실시간으로 모니터링
commands.inventorymonitor.usage = /inventorymonitor <{%0}>
commands.inventorymonitor.parameter.player = 플레이어


